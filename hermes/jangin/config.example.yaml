# jangin 프로필용 config.yaml 예시. 필요한 부분만 <HERMES_HOME>/config.yaml 에 합친다.
# PLUGIN_DIR 은 설치된 플러그인 폴더 (예: ~/.hermes/profiles/jangin/plugins/jangin).

plugins:
  enabled:
    - jangin

# 플러그인의 pre_tool_call 훅이 기본 가드다 (세션 폴더를 안다).
# 아래 셸 훅은 플러그인이 꺼지거나 깨졌을 때를 위한 두 번째 잠금이다. fail_closed: op.py 를 못 찾으면 막는다.
# Hermes 는 command 를 셸 없이 실행한다. 경로에 공백이 있으면 따옴표로 감싼다.
hooks:
  pre_tool_call:
    - matcher: "terminal|write_file|patch|read_file|execute_code"
      # 파이썬은 절대 경로로 (데스크톱 앱이 띄운 게이트웨이는 PATH 가 최소라 /usr/bin/python3 로 잡힐 수 있다)
      command: "/usr/local/bin/python3 -I \"PLUGIN_DIR/skill/scripts/op.py\" guard --format hermes"
      timeout: 20
      fail_closed: true

# 만들기 단계의 반복은 Hermes /goal 이 한다 (docs/hermes-design.md 6.1절). 턴 상한과 되돌리기 스냅숏.
goals:
  max_turns: 20
checkpoints:
  enabled: true      # write_file·patch·파괴적 명령 전에 스냅숏, 사람이 /rollback <N> 으로 되돌림 (docker 백엔드는 안 됨)

# 메신저 승인: 게이트웨이의 허용 사용자만 jangin 명령을 칠 수 있다. 예: .env 에 TELEGRAM_ALLOWED_USERS=123456789
# 더 좁히려면 게이트웨이 프로세스의 환경 변수 OPERATOR_ALLOWED_USERS=123456789 (쉼표로 여러 명).
#
# 가장 엄격한 설정: 프로젝트의 .operator/guard.json 에 "human_via": ["messenger"]
#   → Desktop·CLI 화면의 /ok 도 거부하고 휴대폰 메신저에서 친 /ok 만 받는다.
